name: Chapter clarity feedback
description: Report the exact point where a chapter, example, or exercise becomes unclear.
title: "[good first feedback] "
labels:
  - good first feedback
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Report one exact unclear point after reading a chapter, running an example, or attempting an exercise.
        Precise friction is more useful than a broad review.
        Do not include email addresses, private messages, personal notes, or contact details.

        Minimum accepted report:
        - perspective,
        - command or page tried,
        - evidence signal,
        - last clear idea,
        - first unclear point,
        - smallest useful fix.

        If you cannot fill those six fields, keep reading or running until you can point to one visible sentence, output line, compiler error, table row, code block, type boundary, or exercise prompt.

        This counts as direct reader evidence only if it comes from your own reading, public-page review, or command run and names one concrete evidence signal.
        Broad praise, broad dislike, copied prompts, AI-generated critique, routing issues, and feature requests without a blocked learning step do not count as direct reader evidence.

        No-clone reports are welcome. If you reviewed the online book without cloning the repository, put `public book path` in the command/page field, name the public page you read, and use a visible sentence, heading, diagram, table row, code block, or exercise prompt as the evidence signal.

        Facilitator-transcribed reports are welcome from reading sessions or workshops. If you are transcribing for a participant, preserve one participant's concrete reading or command attempt, write `workshop report` or `reading-session report` in the command/page field, and do not include names, email addresses, private messages, or contact details.

        Evidence signal examples:
        - Rust: compiler error, test name, constructor result, output line, or type boundary.
        - ML: trace line, loss value, framework-translation row, diagram row, or state-update output.
        - Category theory: law, table row, morphism shape, output line, naming rule, or sketch-transfer row.
        - Category-theory transfer: `docs/category-theory-path.md -> Seven Sketches Transfer Drill`, `cargo run --example 05_seven_sketches`, or one bad ML shortcut and safe non-claim.
        - Roadmap category precision: `book/src/roadmap.md -> Attention Mental Model Repair Table`, `book/src/roadmap.md -> Category Shape Diagnostic`, the `Source-Target Audit Card`, `cargo run --example 06_attention_scores`, or `AttentionScores x AttentionMask -> AttentionScores`.
        - Public book or beginner/educator path: public book page, output line, page section, command result, heading, diagram, exercise prompt, link, or missing next action.

        If you are not sure where to start, choose one public review path:
        - Rust engineer first-run path: https://github.com/hghalebi/category_theory_transformer_rs/issues/8
        - ML engineer training and attention path: https://github.com/hghalebi/category_theory_transformer_rs/issues/9
        - Category-theory precision path: https://github.com/hghalebi/category_theory_transformer_rs/issues/10
        - Technical educator learning path: https://github.com/hghalebi/category_theory_transformer_rs/issues/11
        - Beginner-adjacent first confusion path: https://github.com/hghalebi/category_theory_transformer_rs/issues/12

        If you are unsure what a useful report looks like, read the direct reader report examples first:
        https://github.com/hghalebi/category_theory_transformer_rs/blob/main/docs/review-examples.md

        Rewrite-ready checklist:
        - one person read or ran one concrete path;
        - one command, public page, chapter, file, or exercise is named;
        - one evidence signal is visible in the book, terminal output, compiler output, test output, or exercise prompt;
        - the report separates the last clear idea from the first unclear point;
        - the suggested fix is small enough to apply to one chapter, example, table, diagram, or exercise.

        A report that passes this checklist gives maintainers enough evidence to rewrite the affected section without guessing.
        After submission, maintainers may ask for clarification, accept the report as reader evidence, batch it with a repeated theme, or link it to a validated rewrite.

        If the report is about a reference, citation, source-backed claim, or missing source, fill the optional source-role field. Use the source-role table in `book/src/references.md`: repository code and tests, official documentation, academic papers, open textbooks and university material, implementation bridges, or learner-friction signals.
  - type: dropdown
    id: perspective
    attributes:
      label: Your perspective
      description: Choose the closest fit. This helps route the feedback without making assumptions about you.
      options:
        - Rust engineer
        - ML engineer or learner
        - category-theory reader
        - technical educator
        - beginner-adjacent learner
        - other
    validations:
      required: true
  - type: dropdown
    id: friction_lens
    attributes:
      label: Friction lens
      description: Choose the main kind of confusion. This helps route the report to the right kind of fix.
      options:
        - Rust syntax or idiom
        - ML intuition
        - category-theory precision
        - exercise or command evidence
        - source or reference connection
        - learner path or next action
        - other
    validations:
      required: true
  - type: textarea
    id: source_role_check
    attributes:
      label: Optional source-role check
      description: Fill this only when your report is about a reference, citation, source-backed claim, or missing source.
      placeholder: |
        Source role:
        Owned boundary:
        Claim this source supports:
        Claim this source does not support:
        Local Rust file, type, example, or chapter section:
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: Chapter, section, or file
      placeholder: "book/src/02-morphisms-composition.md"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or page you tried
      description: Paste the command, example, test, or public book page you used. If you reviewed without cloning, write `public book path` and name the page.
      placeholder: "cargo run --example 02_morphism_composition or public book path -> Welcome"
    validations:
      required: true
  - type: textarea
    id: evidence_signal
    attributes:
      label: Evidence signal
      description: Name the output line, compiler error, test name, constructor result, public-page sentence, heading, diagram, table row, code block, exercise prompt, or page section that made the issue visible.
      placeholder: "Composition rule: Embedding then Softmax is illegal because Vector != Logits"
    validations:
      required: true
  - type: textarea
    id: unclear_point
    attributes:
      label: First unclear point
      description: Quote the first sentence, code line, output line, or exercise prompt where the path became unclear.
    validations:
      required: true
  - type: textarea
    id: last_clear_idea
    attributes:
      label: Last clear idea
      description: Name the last idea, output line, or code boundary that still made sense before the confusion.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to understand
      description: Say what you thought the chapter or example was about to explain.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Describe the confusion, failed command, missing bridge, or overloaded term.
    validations:
      required: true
  - type: textarea
    id: suggested_fix
    attributes:
      label: What would have helped?
      description: A smaller example, diagram, glossary entry, rewritten paragraph, or expected output is enough.
    validations:
      required: true
